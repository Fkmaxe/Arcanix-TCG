# Exemple pour le Nginx externe (à adapter : domaines, IP du serveur Docker, certificats).
# Le site appelle l'API depuis le navigateur : NEXT_PUBLIC_API_BASE doit être l'URL publique de l'API.

server {
    listen 443 ssl http2;
    server_name arcanix.exemple.fr;                 # FRONTEND_URL / NEXT_PUBLIC_SITE_URL
    # ssl_certificate ... ; ssl_certificate_key ... ;

    location / {
        proxy_pass http://IP_DU_SERVEUR_DOCKER:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.arcanix.exemple.fr;             # NEXT_PUBLIC_API_BASE ; à ajouter à CORS_ORIGINS côté site
    # ssl_certificate ... ; ssl_certificate_key ... ;
    client_max_body_size 2m;

    location / {
        proxy_pass http://IP_DU_SERVEUR_DOCKER:8000;
        proxy_set_header Host $host;
        # Indispensable : la limitation des tentatives de connexion se fait par IP réelle
        # (et FORWARDED_ALLOW_IPS=<IP de ce Nginx> dans le .env du serveur Docker)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
