# Exemple pour la VM Nginx (à adapter : domaines, IP locale de la VM Docker, certificats).
# Exemple d'adresses : VM Nginx 192.168.1.10, VM Docker 192.168.1.20 (même réseau local).
# Le site appelle l'API depuis le navigateur : NEXT_PUBLIC_API_BASE doit être l'URL publique de l'API.

server {
    listen 443 ssl http2;
    server_name arcanix.exemple.fr;                 # FRONTEND_URL / NEXT_PUBLIC_SITE_URL
    # ssl_certificate ... ; ssl_certificate_key ... ;

    location / {
        proxy_pass http://192.168.1.20:3000;   # IP locale de la VM Docker
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name api.arcanix.exemple.fr;             # NEXT_PUBLIC_API_BASE ; à ajouter à CORS_ORIGINS côté site
    # ssl_certificate ... ; ssl_certificate_key ... ;
    client_max_body_size 2m;

    location / {
        proxy_pass http://192.168.1.20:8000;   # IP locale de la VM Docker
        proxy_set_header Host $host;
        # Indispensable : la limitation des tentatives de connexion se fait par IP réelle
        # (et FORWARDED_ALLOW_IPS=192.168.1.10, l'IP de CETTE VM Nginx, dans le .env de la VM Docker)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
