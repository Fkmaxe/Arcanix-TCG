# Arcanix — stack complète. Variables dans .env (voir .env.example).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-pointsdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./API_TCG_ESGI
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-pointsdb}
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?définir DISCORD_BOT_TOKEN dans .env}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DEBUG: ${DEBUG:-false}
      # Emails (laisser SMTP_HOST vide pour désactiver)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Arcanix <no-reply@arcanix.local>}
      SMTP_SECURITE: ${SMTP_SECURITE:-starttls}
      # IP du Nginx externe : l'API lit alors la vraie IP des visiteurs (X-Forwarded-For)
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Réglages avancés (valeurs par défaut adaptées dans la plupart des cas)
      JETON_MDP_HEURES: ${JETON_MDP_HEURES:-48}
      JETON_DISCORD_MINUTES: ${JETON_DISCORD_MINUTES:-15}
      QR_PERIODE_S: ${QR_PERIODE_S:-30}
      POINTAGE_DUREE_H: ${POINTAGE_DUREE_H:-4}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./FRONTEND
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  discordbot:
    build: ./BOT_DISCORD
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?définir DISCORD_TOKEN dans .env}
      API_BASE_URL: http://api:8000
      API_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ANNONCES_CHANNEL_ID: ${DISCORD_ANNONCES_CHANNEL_ID:-}
      DISCORD_ANNONCES_ROLE_ID: ${DISCORD_ANNONCES_ROLE_ID:-}
      DISCORD_ROLE_MEMBRE_ID: ${DISCORD_ROLE_MEMBRE_ID:-}
      DISCORD_ROLE_TOP3_ID: ${DISCORD_ROLE_TOP3_ID:-}
      DISCORD_SYNC_ROLES: ${DISCORD_SYNC_ROLES:-false}
      ANNONCES_INTERVALLE_MIN: ${ANNONCES_INTERVALLE_MIN:-5}
      ROLES_INTERVALLE_MIN: ${ROLES_INTERVALLE_MIN:-15}

volumes:
  postgres_data:
