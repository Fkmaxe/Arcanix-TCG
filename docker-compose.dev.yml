# Développement : rechargement à chaud de l'API et du bot, Postgres exposé.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    ports:
      - "5432:5432"
  api:
    environment:
      DEBUG: "true"
      UVICORN_EXTRA_ARGS: --reload
      # Les emails partent dans Mailpit : http://localhost:8025
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURITE: aucune
    volumes:
      - ./API_TCG_ESGI:/app
  discordbot:
    volumes:
      - ./BOT_DISCORD:/app
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
